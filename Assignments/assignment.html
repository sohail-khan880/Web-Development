<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NOIRÉ — Creative Studio</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, "Segoe UI", sans-serif;
        background: #10131c;
        color: #f5f2ed;
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
      }
      a {
        color: inherit;
        text-decoration: none;
      }

      .site-header {
        width: min(1180px, calc(100% - 48px));
        min-height: 88px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 32px;
        border-bottom: 1px solid rgb(255 255 255 / 10%);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        flex-shrink: 0;
      }

      .brand-mark {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        border: 1px solid #d6a86a;
        border-radius: 50%;
        color: #d6a86a;
        font-family: Georgia, serif;
        font-size: 22px;
        font-style: italic;
      }

      .brand-name {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 21px;
        font-weight: 600;
        letter-spacing: 0.16em;
      }

      .brand-name span {
        color: #d6a86a;
      }

      .main-nav {
        display: flex;
        align-items: center;
        gap: clamp(18px, 3vw, 38px);
        color: #c4c3c4;
        font-size: 13px;
        letter-spacing: 0.04em;
      }

      .main-nav a {
        transition: color 180ms ease;
      }
      .main-nav a:hover,
      .main-nav a:focus-visible {
        color: #d6a86a;
      }

      .nav-cta {
        padding: 12px 18px;
        border: 1px solid rgb(214 168 106 / 65%);
        border-radius: 3px;
        color: #e4c69f;
      }

      .hero {
        width: min(1180px, calc(100% - 48px));
        min-height: calc(100vh - 89px);
        margin: 0 auto;
        display: flex;
        align-items: center;
        padding: 80px 0;
        background: radial-gradient(
          ellipse at 82% 45%,
          rgb(116 78 49 / 18%),
          transparent 42%
        );
      }

      .hero-content {
        max-width: 700px;
      }
      .eyebrow {
        color: #d6a86a;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.25em;
        text-transform: uppercase;
      }

      h1 {
        margin: 24px 0 18px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(52px, 9vw, 100px);
        font-weight: 400;
        letter-spacing: -0.055em;
        line-height: 0.98;
      }

      h1 em {
        color: #d6a86a;
        font-weight: 400;
      }
      .hero p {
        max-width: 490px;
        color: #aaa9ad;
        font-size: 16px;
        line-height: 1.8;
      }

      @media (max-width: 700px) {
        .site-header {
          width: min(100% - 32px, 1180px);
          min-height: 76px;
          flex-wrap: wrap;
          gap: 16px;
          padding: 16px 0;
        }
        .brand-name {
          font-size: 18px;
        }
        .main-nav {
          order: 2;
          width: 100%;
          justify-content: space-between;
          gap: 12px;
          font-size: 11px;
        }
        .nav-cta {
          padding: 9px 10px;
        }
        .hero {
          width: min(100% - 32px, 1180px);
          min-height: calc(100vh - 125px);
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#home" aria-label="Noiré Studio home">
        <span class="brand-mark" aria-hidden="true">N</span>
        <span class="brand-name">NOIRÉ<span>.</span></span>
      </a>

      <nav class="main-nav" aria-label="Main navigation">
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#services">Services</a>
        <a href="#work">Our Work</a>
        <a class="nav-cta" href="#contact"
          >Let’s Talk <span aria-hidden="true">↗</span></a
        >
      </nav>
    </header>

    <main class="hero" id="home">
      <div class="hero-content">
        <span class="eyebrow">Independent creative studio</span>
        <h1>Make it<br /><em>remarkable.</em></h1>
        <p>
          Thoughtful design and digital experiences for brands ready to leave a
          lasting impression.
        </p>
      </div>
    </main>
  </body>
</html>
